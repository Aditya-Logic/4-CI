# .github/workflows/ci_cd.yml

name: CI Pipeline

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: 3.13
    - name: set up cml
      uses: iterative/setup-cml@v2

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run main file
      run: |
        python main.py
    
    # - name: Run Tests
    #   run: |
    #     python -m unittest discover
      
    - name: Create and publish CML report
      env:
        REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "# Model Training Report" > report.md
        echo "## Bar Plots" >> report.md
        echo "Bar plot generated successfully." >> report.md
        echo "## Line Plots" >> report.md
        echo "Line plot generated successfully." >> report.md

        cml comment create --publish=false report.md

